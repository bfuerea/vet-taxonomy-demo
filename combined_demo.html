<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified GBIF Standardizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for the code preview */
        pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        pre::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        pre::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Panel: Data Entry Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 flex flex-col h-full">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Înregistrare Caz</h1>
                    <p class="text-sm text-gray-500 mt-1">Sistem de Taxonomie Standardizată cu GBIF</p>
                </div>
                <!-- Language Toggle -->
                <div class="flex bg-gray-100 rounded-lg p-1">
                    <button id="lang-ro" class="px-3 py-1 text-sm font-medium rounded-md bg-white shadow-sm text-blue-600 transition-all">RO</button>
                    <button id="lang-en" class="px-3 py-1 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition-all">EN</button>
                </div>
            </div>

            <form class="space-y-6 flex-grow">
                <!-- Species Selector -->
                <div>
                    <label id="label-species" for="species" class="block text-sm font-semibold text-gray-700 mb-2">Specie *</label>
                    <div class="relative">
                        <select id="species" class="block w-full pl-4 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 appearance-none cursor-pointer transition-colors hover:bg-white">
                            <option value="" disabled selected>-- Selectați specia --</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Breed Selector -->
                <div id="breed-container" class="opacity-50 transition-opacity duration-300">
                    <label id="label-breed" for="breed" class="block text-sm font-semibold text-gray-700 mb-2">Rasă</label>
                    <div class="relative">
                        <select id="breed" disabled class="block w-full pl-4 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-100 appearance-none cursor-not-allowed transition-colors">
                            <option value="" disabled selected>-- Specia nu necesită rasă --</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    <p id="breed-hint" class="mt-2 text-xs text-gray-500 hidden">Vă rugăm să selectați rasa specifică.</p>
                </div>

                <!-- GBIF Integration Status -->
                <div class="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="text-sm font-semibold text-gray-700 mb-1 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Sincronizare GBIF
                    </div>
                    <div id="gbif-status" class="text-sm text-gray-500">Selectați o specie pentru a prelua datele GBIF.</div>
                    <div id="gbif-details"></div>
                </div>

            </form>

            <div class="mt-8 pt-6 border-t border-gray-100">
                <div class="flex items-center text-sm text-green-600 bg-green-50 p-3 rounded-lg">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="validation-msg">Așteptare selecție...</span>
                </div>
            </div>
        </div>

        <!-- Right Panel: Database JSON Preview -->
        <div class="bg-gray-900 rounded-2xl shadow-xl border border-gray-800 flex flex-col overflow-hidden h-full">
            <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-sm font-mono text-gray-300 flex items-center">
                    <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                    MongoDB Document Preview
                </h2>
                <span class="px-2 py-1 text-xs font-mono bg-gray-700 text-gray-300 rounded">stdTaxonomy</span>
            </div>
            <div class="p-6 flex-grow relative overflow-auto">
                <pre id="json-preview" class="text-sm font-mono text-green-400 m-0 whitespace-pre-wrap break-words">
{
  "stdTaxonomy": null
}</pre>
            </div>
        </div>

    </div>

    <script>
        // --- 1. The Taxonomy Database (Directly from Canvas) ---
                let taxonomyData = [];

        // Fetch taxonomy data from external JSON
        async function loadTaxonomyData() {
            try {
                const response = await fetch('./data/taxonomy_complete_seed.json');
                if (!response.ok) throw new Error('Network response was not ok');
                taxonomyData = await response.json();
                init();
            } catch (error) {
                console.error("Error loading taxonomy data:", error);
                const gbifStatus = document.getElementById('gbif-status');
                if(gbifStatus) {
                    gbifStatus.innerHTML = '<span class="text-red-500">Eroare la încărcarea taxonomy_complete_seed.json. Asigurați-vă că deschideți pagina printr-un server web local (ex: VS Code Live Server), nu direct prin double-click (file://).</span>';
                }
            }
        }

        // --- 2. Application Logic ---
        
        // DOM Elements
        const speciesSelect = document.getElementById('species');
        const breedSelect = document.getElementById('breed');
        const breedContainer = document.getElementById('breed-container');
        const breedHint = document.getElementById('breed-hint');
        const jsonPreview = document.getElementById('json-preview');
        const validationMsg = document.getElementById('validation-msg');
        
        // Language Toggle Elements
        const btnRo = document.getElementById('lang-ro');
        const btnEn = document.getElementById('lang-en');
        const lblSpecies = document.getElementById('label-species');
        const lblBreed = document.getElementById('label-breed');
        
        // State
        let currentLang = 'ro';
        let selectedSpeciesData = null;
        let selectedBreedData = null;
        let selectedGBIFData = null;

        const translations = {
            ro: {
                specie: "Specie *",
                rasa: "Rasă",
                selSpecie: "-- Selectați specia --",
                selRasa: "-- Selectați rasa --",
                noRasa: "-- Specia nu necesită rasă --",
                hint: "Vă rugăm să selectați rasa specifică.",
                valid: "Date standardizate pregătite pentru DB",
                waiting: "Așteptare selecție..."
            },
            en: {
                specie: "Species *",
                rasa: "Breed",
                selSpecie: "-- Select species --",
                selRasa: "-- Select breed --",
                noRasa: "-- Species does not require breed --",
                hint: "Please select the specific breed.",
                valid: "Standardized data ready for DB",
                waiting: "Awaiting selection..."
            }
        };

        // Initialize UI
        function init() {
            populateSpecies();
            setupEventListeners();
            updateJSONPreview();
        }

        // Populate the primary species dropdown
        function populateSpecies() {
            // Sort data alphabetically by current language
            const sortedData = [...taxonomyData].sort((a, b) => 
                a.species[currentLang].localeCompare(b.species[currentLang])
            );

            speciesSelect.innerHTML = `<option value="" disabled selected>${translations[currentLang].selSpecie}</option>`;
            
            sortedData.forEach((item, index) => {
                const option = document.createElement('option');
                // Store the original index from the main array for easy lookup
                const originalIndex = taxonomyData.indexOf(item);
                option.value = originalIndex;
                option.textContent = item.species[currentLang];
                
                // Keep selection if language changes
                if (selectedSpeciesData && taxonomyData[originalIndex].species.ro === selectedSpeciesData.species.ro) {
                    option.selected = true;
                }
                
                speciesSelect.appendChild(option);
            });
        }

        // Populate the breed dropdown based on selected species
        function populateBreeds() {
            if (!selectedSpeciesData || !selectedSpeciesData.has_breeds) {
                // Disable breed selection
                breedSelect.innerHTML = `<option value="" disabled selected>${translations[currentLang].noRasa}</option>`;
                breedSelect.disabled = true;
                breedSelect.classList.remove('bg-white', 'cursor-pointer');
                breedSelect.classList.add('bg-gray-100', 'cursor-not-allowed');
                breedContainer.classList.add('opacity-50');
                breedHint.classList.add('hidden');
                selectedBreedData = null; // Clear any previously selected breed
                return;
            }

            // Enable breed selection
            breedSelect.disabled = false;
            breedSelect.classList.remove('bg-gray-100', 'cursor-not-allowed');
            breedSelect.classList.add('bg-white', 'cursor-pointer');
            breedContainer.classList.remove('opacity-50');
            breedHint.classList.remove('hidden');
            breedHint.textContent = translations[currentLang].hint;

            // Sort breeds alphabetically
            const sortedBreeds = [...selectedSpeciesData.breeds].sort((a, b) => 
                a[currentLang].localeCompare(b[currentLang])
            );

            breedSelect.innerHTML = `<option value="" disabled selected>${translations[currentLang].selRasa}</option>`;
            
            sortedBreeds.forEach((breed, index) => {
                const option = document.createElement('option');
                // Store original breed index based on the main array
                const originalIndex = selectedSpeciesData.breeds.indexOf(breed);
                option.value = originalIndex;
                option.textContent = breed[currentLang];
                
                // Keep selection if language changes
                if (selectedBreedData && selectedSpeciesData.breeds[originalIndex].ro === selectedBreedData.ro) {
                    option.selected = true;
                }

                breedSelect.appendChild(option);
            });
        }

        // Update the JSON visualization panel
        function updateJSONPreview() {
            if (!selectedSpeciesData) {
                jsonPreview.textContent = JSON.stringify({ stdTaxonomy: null }, null, 2);
                validationMsg.textContent = translations[currentLang].waiting;
                validationMsg.parentElement.classList.replace('bg-green-50', 'bg-yellow-50');
                validationMsg.parentElement.classList.replace('text-green-600', 'text-yellow-600');
                return;
            }

            // Build the object exactly as it will be saved to MongoDB
            const outputObj = {
                stdTaxonomy: {
                    species: selectedSpeciesData.species,
                    isValidated: true
                }
            };

            if (selectedGBIFData && selectedGBIFData.key) {
                outputObj.stdTaxonomy.gbif_key = selectedGBIFData.key;
            }

            // Handle breed logic
            if (selectedSpeciesData.has_breeds) {
                if (selectedBreedData) {
                    outputObj.stdTaxonomy.breed = selectedBreedData;
                } else {
                    // Species requires breed, but none selected yet
                    outputObj.stdTaxonomy.breed = { ro: "NECUNOSCUT", en: "UNKNOWN" };
                    outputObj.stdTaxonomy.isValidated = false;
                }
            } else {
                // Species does not have breeds (like Wolves, Bees)
                outputObj.stdTaxonomy.breed = { ro: "N/A", en: "N/A" };
            }

            // Syntax highlight and display
            jsonPreview.textContent = JSON.stringify(outputObj, null, 2);

            // Update Validation UI
            if (outputObj.stdTaxonomy.isValidated) {
                validationMsg.textContent = translations[currentLang].valid;
                validationMsg.parentElement.classList.replace('bg-yellow-50', 'bg-green-50');
                validationMsg.parentElement.classList.replace('text-yellow-600', 'text-green-600');
            } else {
                validationMsg.textContent = translations[currentLang].hint;
                validationMsg.parentElement.classList.replace('bg-green-50', 'bg-yellow-50');
                validationMsg.parentElement.classList.replace('text-green-600', 'text-yellow-600');
            }
        }

        async function fetchGBIF(latinName) {
            selectedGBIFData = null;
            const gbifStatus = document.getElementById('gbif-status');
            const gbifDetails = document.getElementById('gbif-details');
            
            gbifStatus.innerHTML = '<span class="text-blue-600 animate-pulse">Preluare date GBIF...</span>';
            gbifDetails.innerHTML = '';
            updateJSONPreview(); 

            try {
                const response = await fetch(`https://api.gbif.org/v1/species?name=${encodeURIComponent(latinName)}`);
                if (!response.ok) throw new Error('Eroare rețea');
                const responseData = await response.json();
                
                if (responseData.results && responseData.results.length > 0) {
                    const data = responseData.results[0]; // Take the first result
                    selectedGBIFData = data;
                    gbifStatus.innerHTML = `<span class="text-green-600 font-medium">✓ ${data.scientificName} (ID: ${data.key})</span>`;
                    gbifDetails.innerHTML = `
                        <div class="text-xs text-gray-500 mt-2 bg-white p-2 rounded border border-gray-100 shadow-inner">
                            <span class="block mb-1 font-semibold">Ierarhie Taxonomică (Rang: ${data.rank || 'N/A'}):</span>
                            Regn: ${data.kingdom || 'N/A'} > Încrengătură: ${data.phylum || 'N/A'} > Clasă: ${data.class || 'N/A'} > Ordin: ${data.order || 'N/A'} > Familie: ${data.family || 'N/A'}
                        </div>
                    `;
                } else {
                    gbifStatus.innerHTML = '<span class="text-red-500">Nicio potrivire exactă găsită în GBIF.</span>';
                }
            } catch (error) {
                gbifStatus.innerHTML = `<span class="text-red-500">Eroare GBIF: ${error.message}</span>`;
            }
            updateJSONPreview(); 
        }

        // Set up all UI interactions
        function setupEventListeners() {
            // Species Dropdown Change
            speciesSelect.addEventListener('change', (e) => {
                selectedSpeciesData = taxonomyData[e.target.value];
                selectedBreedData = null; // Reset breed when species changes
                populateBreeds();
                fetchGBIF(selectedSpeciesData.species.latin);
            });

            // Breed Dropdown Change
            breedSelect.addEventListener('change', (e) => {
                selectedBreedData = selectedSpeciesData.breeds[e.target.value];
                updateJSONPreview();
            });

            // Language Toggles
            btnRo.addEventListener('click', (e) => {
                e.preventDefault();
                setLanguage('ro');
            });
            
            btnEn.addEventListener('click', (e) => {
                e.preventDefault();
                setLanguage('en');
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            
            // UI Toggle Styles
            if(lang === 'ro') {
                btnRo.classList.replace('text-gray-500', 'text-blue-600');
                btnRo.classList.replace('hover:text-gray-700', 'bg-white');
                btnRo.classList.add('shadow-sm');
                
                btnEn.classList.replace('text-blue-600', 'text-gray-500');
                btnEn.classList.replace('bg-white', 'hover:text-gray-700');
                btnEn.classList.remove('shadow-sm');
            } else {
                btnEn.classList.replace('text-gray-500', 'text-blue-600');
                btnEn.classList.replace('hover:text-gray-700', 'bg-white');
                btnEn.classList.add('shadow-sm');
                
                btnRo.classList.replace('text-blue-600', 'text-gray-500');
                btnRo.classList.replace('bg-white', 'hover:text-gray-700');
                btnRo.classList.remove('shadow-sm');
            }

            // Update Labels
            lblSpecies.textContent = translations[currentLang].specie;
            lblBreed.textContent = translations[currentLang].rasa;
            
            if (!selectedSpeciesData) {
                validationMsg.textContent = translations[currentLang].waiting;
            } else if (selectedSpeciesData.has_breeds && !selectedBreedData) {
                validationMsg.textContent = translations[currentLang].hint;
            } else {
                validationMsg.textContent = translations[currentLang].valid;
            }

            // Re-render dropdowns retaining selection
            populateSpecies();
            populateBreeds();
        }

        // Boot up
        loadTaxonomyData();

    </script>
</body>
</html>
