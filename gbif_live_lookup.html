<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBIF Live Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for the code preview */
        pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        pre::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        pre::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        .result-item {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .result-item:hover {
            background-color: #eff6ff;
        }
        /* Gallery Styles */
        .img-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .img-thumb {
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e5e7eb;
        }
        .img-thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        /* Lightbox Styles */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            cursor: pointer;
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .lang-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Panel: Data Entry Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 flex flex-col h-full">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">GBIF Live Lookup</h1>
                    <p class="text-sm text-gray-500 mt-1">Căutare live în baza de date globală GBIF</p>
                </div>
            </div>

            <div class="space-y-6 flex-grow flex flex-col">
                <!-- Search Configuration -->
                <div class="flex items-center space-x-3">
                    <input type="checkbox" id="limit-chordata" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500" checked>
                    <label for="limit-chordata" class="text-sm font-medium text-gray-700">Limitează căutarea la Animalia (Regn) și Chordata (Încrengătură)</label>
                </div>

                <!-- Search Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="search-input" class="block text-sm font-semibold text-gray-700">Căutare Specie *</label>
                        <div id="lang-selector" class="flex space-x-1">
                            <button data-lang="ron" class="lang-btn active px-3 py-1 text-xs font-bold rounded-lg border transition-all">RO</button>
                            <button data-lang="eng" class="lang-btn px-3 py-1 text-xs font-bold rounded-lg border bg-gray-50 text-gray-600 hover:bg-gray-100 transition-all">EN</button>
                            <button data-lang="fra" class="lang-btn px-3 py-1 text-xs font-bold rounded-lg border bg-gray-50 text-gray-600 hover:bg-gray-100 transition-all">FR</button>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <input type="text" id="search-input" placeholder="Introduceți numele (ex: Canis lupus)" class="block w-full pl-4 pr-4 py-3 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-xl border bg-gray-50 transition-colors hover:bg-white">
                        <button id="search-btn" class="px-6 py-3 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-sm flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            Caută
                        </button>
                    </div>
                </div>

                <!-- Results List -->
                <div class="relative flex-grow flex flex-col">
                    <div id="loading-indicator" class="hidden absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
                        <div class="flex items-center space-x-2 text-blue-600">
                            <svg class="animate-spin h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="font-medium text-sm">Se caută...</span>
                        </div>
                    </div>

                    <div id="results-container" class="hidden flex-grow overflow-y-auto bg-gray-50 border border-gray-200 rounded-xl max-h-64 mt-2 divide-y divide-gray-200 shadow-inner">
                        <!-- Results injected here -->
                    </div>
                </div>

                <!-- Status Panel -->
                <div id="status-panel" class="hidden mt-4 p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-sm font-semibold text-blue-800 mb-1 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Specie selectată cu succes
                            </div>
                            <div id="selected-species-name" class="text-lg font-bold text-gray-900 mt-2"></div>
                            <div id="selected-species-ro" class="text-sm font-medium text-blue-600 mt-1"></div>
                            <div id="translation-status" class="text-xs text-gray-500 mt-2 flex items-center"></div>
                            
                            <!-- Image Gallery -->
                            <div id="image-gallery-container" class="mt-4 pt-4 border-t border-blue-100">
                                <div class="text-xs font-semibold text-blue-800 uppercase tracking-wider mb-2">Galerie Imagini</div>
                                <div id="image-gallery" class="img-grid">
                                    <!-- Images will be injected here -->
                                </div>
                                <div id="image-error" class="text-xs text-gray-400 mt-2 hidden">Nu s-au găsit imagini oficiale.</div>
                                <a id="google-images-link" href="#" target="_blank" class="text-xs text-blue-600 hover:underline mt-2 inline-block flex items-center">
                                    Caută pe Google Images 
                                    <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Database JSON Preview -->
        <div class="bg-gray-900 rounded-2xl shadow-xl border border-gray-800 flex flex-col overflow-hidden h-full min-h-[500px]">
            <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-sm font-mono text-gray-300 flex items-center">
                    <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                    MongoDB Document Preview
                </h2>
                <span class="px-2 py-1 text-xs font-mono bg-gray-700 text-gray-300 rounded">gbifData</span>
            </div>
            <div class="p-6 flex-grow relative overflow-auto">
                <pre id="json-preview" class="text-sm font-mono text-green-400 m-0 whitespace-pre-wrap break-words">
{
  "status": "Așteptare selecție specie..."
}</pre>
            </div>
        </div>

    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="Enlarged view">
    </div>

    <script>
        // DOM Elements
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const limitChordataCheckbox = document.getElementById('limit-chordata');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultsContainer = document.getElementById('results-container');
        const statusPanel = document.getElementById('status-panel');
        const selectedSpeciesName = document.getElementById('selected-species-name');
        const selectedSpeciesRo = document.getElementById('selected-species-ro');
        const translationStatus = document.getElementById('translation-status');
        const jsonPreview = document.getElementById('json-preview');
        const imageGallery = document.getElementById('image-gallery');
        const imageError = document.getElementById('image-error');
        const googleImagesLink = document.getElementById('google-images-link');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        
        let activeLanguage = 'ron';
        const langBtns = document.querySelectorAll('.lang-btn');
        const placeholders = {
            'ron': 'Introduceți numele în română (ex: cal)',
            'eng': 'Enter name in English (e.g. horse)',
            'fra': 'Entrez le nom en français (ex: cheval)'
        };

        // Event Listeners
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                langBtns.forEach(b => {
                    b.classList.remove('active', 'bg-blue-600', 'text-white');
                    b.classList.add('bg-gray-50', 'text-gray-600');
                });
                
                btn.classList.add('active', 'bg-blue-600', 'text-white');
                btn.classList.remove('bg-gray-50', 'text-gray-600');
                
                activeLanguage = btn.dataset.lang;
                searchInput.placeholder = placeholders[activeLanguage];
                searchInput.focus();
            });
        });

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Reset UI
            statusPanel.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            resultsContainer.innerHTML = '';
            loadingIndicator.classList.remove('hidden');

            // Build URL
            let url = `https://api.gbif.org/v1/species/search?q=${encodeURIComponent(query)}&rank=SPECIES&status=ACCEPTED&limit=30`;
            
            // Apply Constraints
            if (limitChordataCheckbox.checked) {
                // In GBIF API, to filter by Kingdom/Phylum in free text search, we must use higherTaxonKey
                // 44 = Chordata. (This inherently filters out viruses, plants, and insects/arthropods).
                url += `&higherTaxonKey=44`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('GBIF API error');
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    renderResults(data.results);
                    resultsContainer.classList.remove('hidden');
                } else {
                    resultsContainer.innerHTML = `<div class="p-6 text-center text-gray-500">Nu s-au găsit rezultate pentru "${query}". <br>Încercați să debifați limitarea la Chordata.</div>`;
                    resultsContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Search Error:", error);
                resultsContainer.innerHTML = `<div class="p-6 text-center text-red-500">Eroare la contactarea API-ului GBIF.</div>`;
                resultsContainer.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function renderResults(results) {
            resultsContainer.innerHTML = '';
            
            // Prioritize results that have a vernacular name in the active language
            const sortedResults = [...results].sort((a, b) => {
                const aHasLang = (a.vernacularNames || []).some(v => v.language === activeLanguage || (activeLanguage === 'ron' && v.language === 'rum') || (activeLanguage === 'fra' && v.language === 'fre'));
                const bHasLang = (b.vernacularNames || []).some(v => v.language === activeLanguage || (activeLanguage === 'ron' && v.language === 'rum') || (activeLanguage === 'fra' && v.language === 'fre'));
                
                if (aHasLang && !bHasLang) return -1;
                if (!aHasLang && bHasLang) return 1;
                return 0;
            });

            sortedResults.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item p-4 border-b border-gray-100 flex flex-col';
                
                const sciName = item.scientificName || 'Necunoscut';
                const vernaculars = item.vernacularNames || [];
                
                const ron = vernaculars.find(v => v.language === 'ron' || v.language === 'rum');
                const eng = vernaculars.find(v => v.language === 'eng');
                const fra = vernaculars.find(v => v.language === 'fra' || v.language === 'fre');

                const names = [];
                if (ron) names.push(`<span class="${activeLanguage === 'ron' ? 'font-bold text-blue-600' : ''}">RO: ${ron.vernacularName}</span>`);
                if (eng) names.push(`<span class="${activeLanguage === 'eng' ? 'font-bold text-blue-600' : ''}">EN: ${eng.vernacularName}</span>`);
                if (fra) names.push(`<span class="${activeLanguage === 'fra' ? 'font-bold text-blue-600' : ''}">FR: ${fra.vernacularName}</span>`);
                
                // Fallback if none of the preferred languages are found but some vernacular name exists
                if (names.length === 0 && (item.vernacularName || (vernaculars.length > 0))) {
                    const fallback = item.vernacularName || vernaculars[0].vernacularName;
                    names.push(fallback);
                }

                const commonNameDisplay = names.length > 0 ? `(${names.join(' | ')})` : '';
                const taxonomy = `${item.kingdom || ''} > ${item.phylum || ''} > ${item.class || ''} > ${item.order || ''} > ${item.family || ''}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-gray-900 italic">${sciName}</span>
                            <div class="text-xs text-gray-600 mt-0.5">${commonNameDisplay}</div>
                        </div>
                        <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full font-mono">Key: ${item.key}</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">${taxonomy}</div>
                `;
                
                div.addEventListener('click', () => selectSpecies(item));
                resultsContainer.appendChild(div);
            });
        }

        async function selectSpecies(item) {
            // Hide list
            resultsContainer.classList.add('hidden');
            
            // Update UI
            selectedSpeciesName.innerHTML = `<span class="italic">${item.scientificName}</span>`;
            selectedSpeciesRo.textContent = 'Se prelucrează datele...';
            translationStatus.innerHTML = `
                <svg class="animate-spin h-3 w-3 mr-1 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Preluare date native GBIF
            `;
            statusPanel.classList.remove('hidden');

            const vernaculars = item.vernacularNames || [];
            
            // Extract specific languages
            const roMatch = vernaculars.find(v => v.language === 'ron' || v.language === 'rum');
            const enMatch = vernaculars.find(v => v.language === 'eng');
            const fraMatch = vernaculars.find(v => v.language === 'fra' || v.language === 'fre');
            
            let roName = roMatch ? roMatch.vernacularName : '';
            let enName = enMatch ? enMatch.vernacularName : (item.vernacularName || '');

            // Group only allowed translations (RO, EN, FR) for the JSON preview
            const allowedLangs = ['ron', 'eng', 'fra'];
            const allTranslations = vernaculars.reduce((acc, curr) => {
                let lang = curr.language;
                if (!lang) return acc;

                // Normalize codes
                if (lang === 'rum') lang = 'ron';
                if (lang === 'fre') lang = 'fra';

                if (!allowedLangs.includes(lang)) return acc;

                if (!acc[lang]) acc[lang] = [];
                if (!acc[lang].includes(curr.vernacularName)) {
                    acc[lang].push(curr.vernacularName);
                }
                return acc;
            }, {});

            if (roName) {
                translationStatus.innerHTML = `
                    <svg class="w-3 h-3 mr-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Denumire română găsită în GBIF
                `;
            } else if (enName) {
                roName = enName;
                translationStatus.innerHTML = `
                    <svg class="w-3 h-3 mr-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Folosire denumire engleză (lipsă RO în GBIF)
                `;
            } else {
                roName = '(Fără denumire comună)';
                translationStatus.innerHTML = `Nu există denumire comună în GBIF.`;
            }

            selectedSpeciesRo.textContent = roName;

            // Generate MongoDB document structure
            const documentPayload = {
                "taxonKey": item.key,
                "speciesKey": item.speciesKey || item.key,
                "kingdom": item.kingdom,
                "kingdomKey": item.kingdomKey,
                "phylum": item.phylum,
                "phylumKey": item.phylumKey,
                "class_name": item.class,
                "classKey": item.classKey,
                "order": item.order,
                "orderKey": item.orderKey,
                "family": item.family,
                "familyKey": item.familyKey,
                "genus": item.genus,
                "genusKey": item.genusKey,
                "scientificName": item.scientificName,
                "canonicalName": item.canonicalName,
                "taxonomicStatus": item.taxonomicStatus,
                "vernacularNames": allTranslations,
                "localNames": {
                    "en": enMatch ? enMatch.vernacularName : (item.vernacularName || null),
                    "ro": roMatch ? roMatch.vernacularName : null,
                    "fr": fraMatch ? fraMatch.vernacularName : null
                },
                "source": "GBIF Live API Lookup"
            };

            // Remove null/undefined properties for cleaner JSON preview
            Object.keys(documentPayload).forEach(key => {
                if (documentPayload[key] === undefined || documentPayload[key] === null) {
                    // We keep null for localNames as placeholder
                }
            });

            jsonPreview.textContent = JSON.stringify(documentPayload, null, 2);

            // Trigger Image Fetching
            fetchImages(item);
        }


        async function fetchImages(item) {
            imageGallery.innerHTML = '';
            imageError.classList.add('hidden');
            const sciName = item.scientificName.split(' ')[0] + ' ' + (item.scientificName.split(' ')[1] || ''); // Simplify to Genus species
            
            googleImagesLink.href = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.scientificName)}`;

            const imageUrls = new Set();

            // 1. Fetch from GBIF Media
            try {
                const gbifMediaUrl = `https://api.gbif.org/v1/species/${item.key}/media`;
                const response = await fetch(gbifMediaUrl);
                if (response.ok) {
                    const data = await response.json();
                    data.results.forEach(m => {
                        if (m.type === 'StillImage' && m.identifier) {
                            imageUrls.add(m.identifier);
                        }
                    });
                }
            } catch (e) { console.error("GBIF Image error", e); }

            // 2. Fetch from Wikipedia
            try {
                const wpUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=500&titles=${encodeURIComponent(sciName)}&origin=*`;
                const response = await fetch(wpUrl);
                if (response.ok) {
                    const data = await response.json();
                    const pages = data.query.pages;
                    for (let id in pages) {
                        if (pages[id].thumbnail && pages[id].thumbnail.source) {
                            imageUrls.add(pages[id].thumbnail.source);
                        }
                    }
                }
            } catch (e) { console.error("Wikipedia Image error", e); }

            if (imageUrls.size === 0) {
                imageError.classList.remove('hidden');
            } else {
                Array.from(imageUrls).slice(0, 6).forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'img-thumb';
                    img.onerror = () => img.remove(); // Remove broken images
                    img.onclick = (e) => {
                        e.stopPropagation();
                        lightboxImg.src = url;
                        lightbox.style.display = 'flex';
                    };
                    imageGallery.appendChild(img);
                });
            }
        }
    </script>
</body>
</html>
